<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Une analyse de l'œuvre Girl at a Mirror de Norman Rockwell.">
    <title>Girl at a Mirror - Norman Rockwell</title>
    <!-- Elegant Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Anti-flash : applique le thème AVANT le rendu de la page -->
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
</head>

<body>
    <header>
        <!-- Rempli par content.js -->
        <h1 id="site-title"></h1>
        <p  id="site-subtitle"></p>
        <button id="theme-toggle">Mode Sombre</button>
    </header>

    <main>
        <!-- ── Image principale ─────────────────────────────── -->
        <section class="hero">
            <div class="image-wrapper" id="tilt-wrapper">
                <img src="Norman-Rockwell-Girl-at-Mirror-1954-1.jpg"
                    alt="Girl at a Mirror" class="main-image" fetchpriority="high">
            </div>
        </section>

        <!-- ── Introduction ─────────────────────────────────── -->
        <section class="introduction">
            <h2 id="intro-heading"></h2>
            <p  id="intro-text"></p>
        </section>

        <!-- ── Observation ──────────────────────────────────── -->
        <section class="observation">
            <h2 id="observation-heading"></h2>
            <div id="observation-items"></div>
        </section>

        <!-- ── Analysis ─────────────────────────────────────── -->
        <section class="analysis">
            <h2 id="analysis-heading"></h2>
            <div id="analysis-items"></div>
        </section>

        <!-- ── Discussion ───────────────────────────────────── -->
        <section class="discussion">
            <h2 id="discussion-heading"></h2>
            <div id="discussion-items"></div>
        </section>

        <!-- ── Creative Expression ──────────────────────────── -->
        <section class="creative-expression">
            <h2 id="creative-heading"></h2>

            <!-- Short Story -->
            <div class="story">
                <h3 id="story-heading"></h3>
                <div id="story-paragraphs"></div>
            </div>

            <!-- Artworks -->
            <div id="artworks-container"></div>
        </section>

        <!-- ── Downloads ─────────────────────────────────────── -->
        <section class="download-section scroll-reveal">
            <h2 id="downloads-heading"></h2>
            <div class="download-buttons" id="download-buttons"></div>
        </section>
    </main>

    <footer>
        <div class="credits">
            <p  class="credits-title" id="footer-credits-title"></p>
            <ul class="credits-list" id="footer-authors"></ul>
        </div>
        <div class="footer-bottom">
            <p class="hosting-info" id="footer-hosting"></p>
            <p><a id="footer-legal-link" class="legal-link" href="#"></a></p>
        </div>
    </footer>

    <!-- Chargez content.js EN PREMIER, puis script.js -->
    <script src="content.js"></script>
    <script src="script.js" defer></script>
</body>

</html>
